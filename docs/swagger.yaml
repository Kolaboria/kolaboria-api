basePath: /
definitions:
  auth.AuthResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/auth.UserResponse'
      verification_resend_available_at:
        type: string
    type: object
  auth.CurrentUserProfileResp:
    properties:
      account_type:
        type: string
      avatar:
        type: string
      bio:
        type: string
      headline:
        type: string
      is_verified:
        type: boolean
      location:
        type: string
      updated_at:
        type: string
    type: object
  auth.CurrentUserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      email_verified_at:
        type: string
      id:
        type: string
      initiable_organizations:
        items:
          $ref: '#/definitions/auth.InitiableOrganizationResponse'
        type: array
      is_active:
        type: boolean
      name:
        type: string
      profile:
        $ref: '#/definitions/auth.CurrentUserProfileResp'
      system_role:
        $ref: '#/definitions/auth.SystemRole'
      username:
        type: string
    type: object
  auth.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  auth.GoogleCallbackRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  auth.InitiableOrganizationResponse:
    properties:
      id:
        type: string
      name:
        type: string
      slug:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.LoginResponse:
    properties:
      access_token:
        type: string
      email:
        type: string
      email_verified_at:
        type: string
      name:
        type: string
      refresh_token:
        type: string
      system_role:
        $ref: '#/definitions/auth.SystemRole'
    type: object
  auth.ProfileResponse:
    properties:
      account_type:
        type: string
      avatar:
        type: string
      bio:
        type: string
      headline:
        type: string
      is_verified:
        type: boolean
      location:
        type: string
      updated_at:
        type: string
    type: object
  auth.RefreshTokenRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  auth.RegisterRequest:
    properties:
      confirmPassword:
        type: string
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        minLength: 8
        type: string
    required:
    - confirmPassword
    - email
    - name
    - password
    type: object
  auth.RegistrationResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      email_verified_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      profile:
        $ref: '#/definitions/auth.ProfileResponse'
      system_role:
        $ref: '#/definitions/auth.SystemRole'
      username:
        type: string
      verification_resend_available_at:
        type: string
    type: object
  auth.ResendVerificationRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  auth.ResetPasswordRequest:
    properties:
      confirmPassword:
        type: string
      password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - confirmPassword
    - password
    - token
    type: object
  auth.SystemRole:
    enum:
    - user
    - admin
    type: string
    x-enum-varnames:
    - SystemRoleUser
    - SystemRoleAdmin
  auth.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      email_verified_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      profile:
        $ref: '#/definitions/auth.ProfileResponse'
      system_role:
        $ref: '#/definitions/auth.SystemRole'
      username:
        type: string
    type: object
  auth.VerificationResendResponse:
    properties:
      verification_resend_available_at:
        type: string
    type: object
  master.ItemResponse:
    properties:
      id:
        type: string
      name:
        type: string
      slug:
        type: string
    type: object
  master.ListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/master.ItemResponse'
        type: array
      message:
        type: string
      meta:
        $ref: '#/definitions/master.PaginationMeta'
      status:
        type: integer
    type: object
  master.LocationDetailResponse:
    properties:
      district:
        $ref: '#/definitions/master.LocationInfo'
      postal_code:
        type: string
      province:
        $ref: '#/definitions/master.LocationInfo'
      regency:
        $ref: '#/definitions/master.LocationInfo'
      village:
        $ref: '#/definitions/master.LocationInfo'
    type: object
  master.LocationDetailResultResponse:
    properties:
      data:
        $ref: '#/definitions/master.LocationDetailResponse'
      message:
        type: string
      status:
        type: integer
    type: object
  master.LocationInfo:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  master.PaginationMeta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  master.SearchLocationListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/master.SearchLocationResponse'
        type: array
      message:
        type: string
      status:
        type: integer
    type: object
  master.SearchLocationResponse:
    properties:
      district:
        type: string
      postal_code:
        type: string
      province:
        type: string
      regency:
        type: string
      village:
        type: string
      village_id:
        type: integer
    type: object
  profile.AddSkillRequest:
    properties:
      isPrimary:
        type: boolean
      skillId:
        type: string
    required:
    - skillId
    type: object
  profile.AddToolRequest:
    properties:
      toolId:
        type: string
    required:
    - toolId
    type: object
  profile.CareerHistoryRequest:
    properties:
      company:
        maxLength: 150
        minLength: 2
        type: string
      description:
        maxLength: 2000
        type: string
      endMonth:
        maximum: 12
        minimum: 1
        type: integer
        x-nullable: true
      endYear:
        minimum: 1950
        type: integer
        x-nullable: true
      startMonth:
        maximum: 12
        minimum: 1
        type: integer
        x-nullable: true
      startYear:
        minimum: 1950
        type: integer
      title:
        maxLength: 150
        minLength: 2
        type: string
    required:
    - company
    - startYear
    - title
    type: object
  profile.CareerHistoryResponse:
    properties:
      company:
        type: string
      description:
        type: string
      end_month:
        type: integer
        x-nullable: true
      end_year:
        type: integer
        x-nullable: true
      id:
        type: string
      start_month:
        type: integer
        x-nullable: true
      start_year:
        type: integer
      title:
        type: string
    type: object
  profile.ExperienceLevel:
    enum:
    - Beginner
    - Intermediate
    - Advanced
    - Expert
    type: string
    x-enum-varnames:
    - ExperienceLevelBeginner
    - ExperienceLevelIntermediate
    - ExperienceLevelAdvanced
    - ExperienceLevelExpert
  profile.MyProfileDetailResponse:
    properties:
      account_type:
        type: string
      address:
        type: string
      avatar:
        type: string
      bio:
        type: string
      created_at:
        type: string
      external_links:
        additionalProperties:
          type: string
        type: object
      full_name:
        type: string
      headline:
        type: string
      id:
        type: string
      is_verified:
        type: boolean
      location:
        type: string
      skills:
        items:
          $ref: '#/definitions/profile.UserSkillResponse'
        type: array
      talent_profile:
        $ref: '#/definitions/profile.TalentProfileResponse'
      tools:
        items:
          $ref: '#/definitions/profile.UserToolResponse'
        type: array
      updated_at:
        type: string
      username:
        type: string
      village:
        $ref: '#/definitions/profile.ProfileVillageResponse'
      village_id:
        type: integer
    type: object
  profile.OnboardingStatusResponse:
    properties:
      is_onboarded:
        type: boolean
    type: object
  profile.ProfileVillageResponse:
    properties:
      district:
        type: string
      postal_code:
        type: string
      province:
        type: string
      regency:
        type: string
      village:
        type: string
      village_id:
        type: integer
    type: object
  profile.SubmitOnboardingRequest:
    properties:
      bio:
        maxLength: 300
        type: string
      experienceLevel:
        allOf:
        - $ref: '#/definitions/profile.ExperienceLevel'
        enum:
        - Beginner
        - Intermediate
        - Advanced
        - Expert
      externalLink:
        type: string
      goal:
        maxLength: 200
        type: string
      primarySkillId:
        type: string
      toolIds:
        items:
          type: string
        maxItems: 5
        type: array
    required:
    - experienceLevel
    - primarySkillId
    type: object
  profile.TalentProfileResponse:
    properties:
      experience_level:
        $ref: '#/definitions/profile.ExperienceLevel'
      goal:
        type: string
    type: object
  profile.UpdateProfileRequest:
    properties:
      address:
        type: string
      bio:
        type: string
      experienceLevel:
        $ref: '#/definitions/profile.ExperienceLevel'
      fullName:
        type: string
      goal:
        type: string
      headline:
        type: string
      villageId:
        type: integer
    type: object
  profile.UserSkillResponse:
    properties:
      id:
        type: string
      is_primary:
        type: boolean
      name:
        type: string
      skill_id:
        type: string
      slug:
        type: string
    type: object
  profile.UserToolResponse:
    properties:
      id:
        type: string
      name:
        type: string
      slug:
        type: string
      tool_id:
        type: string
    type: object
  response.ErrorData:
    properties:
      trace_id:
        type: string
    type: object
  response.ErrorResponse:
    properties:
      data:
        $ref: '#/definitions/response.ErrorData'
      message:
        type: string
      status:
        type: integer
    type: object
  response.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
      meta: {}
      status:
        type: integer
    type: object
info:
  contact: {}
  description: Backend API for Kolaboria Platform
  title: Kolaboria API
  version: "1.0"
paths:
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Send password reset link to user email
      parameters:
      - description: Forgot Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Forgot Password
      tags:
      - auth
  /api/v1/auth/google:
    post:
      consumes:
      - application/json
      description: Authenticate via Google OAuth authorization code
      parameters:
      - description: Google Callback Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.GoogleCallbackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Google Login
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return tokens
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Login
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke refresh token and end session
      parameters:
      - description: Logout Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Logout
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: |-
        Get current account identity, system role, and authorized organization choices from persisted state
        Login with POST /api/v1/auth/login, copy data.access_token, and set Swagger Authorize to Bearer <access_token>. Then use Try it out on this GET endpoint; no request body is required.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.CurrentUserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Current User
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Get a new access token using a valid refresh token
      parameters:
      - description: Refresh Token Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Refresh Token
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user account
      parameters:
      - description: Register Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.RegistrationResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Register
      tags:
      - auth
  /api/v1/auth/resend-verification:
    post:
      consumes:
      - application/json
      description: Resend email verification link with 60s cooldown
      parameters:
      - description: Resend Verification Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ResendVerificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.VerificationResendResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Resend Verification
      tags:
      - auth
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Reset user password using valid token
      parameters:
      - description: Reset Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Reset Password
      tags:
      - auth
  /api/v1/auth/verify-email:
    get:
      description: Verify user email using token
      parameters:
      - description: Verification Token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Verify Email
      tags:
      - auth
  /api/v1/master-data/contribution-roles:
    get:
      parameters:
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 50
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Literal case-insensitive substring search
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/master.ListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "408":
          description: Request Timeout
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: List contribution roles
      tags:
      - master-data
  /api/v1/master-data/locations/{village_id}:
    get:
      description: Get detailed hierarchy (province, regency, district, village) by
        village ID
      parameters:
      - description: Village ID
        in: path
        name: village_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/master.LocationDetailResultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "408":
          description: Request Timeout
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get location detail
      tags:
      - master-data
  /api/v1/master-data/locations/search:
    get:
      description: Search locations (villages, districts, regencies, provinces) by
        keyword
      parameters:
      - description: Search keyword (min 2 characters)
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/master.SearchLocationListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "408":
          description: Request Timeout
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Search locations
      tags:
      - master-data
  /api/v1/master-data/skills:
    get:
      parameters:
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 50
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Literal case-insensitive substring search
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/master.ListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "408":
          description: Request Timeout
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "504":
